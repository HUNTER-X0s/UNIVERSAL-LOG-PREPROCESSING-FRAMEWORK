[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ulpf-foundation"
version = "0.1.0"
description = "Phase 1 foundation for the Universal Log Pre-processing Framework"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.111.0",
  "jsonschema==4.26.0",
  "pydantic==2.7.4",
  "uvicorn==0.30.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.27.0",
  "mypy==1.14.1",
  "pip-audit==2.8.0",
  "ruff==0.9.2",
]

[project.scripts]
ulpf-api = "ulpf_api.main:main"
ulpf-worker = "ulpf_worker.main:main"

[tool.setuptools.packages.find]
where = ["apps/api", "apps/worker", "packages/contracts", "packages/domain", "packages/ingestion", "packages/normalization", "packages/parser-runtime", "packages/platform", "packages/semantic", "packages/mapping", "packages/onboarding", "packages/ai"]
include = ["ulpf_api*", "ulpf_worker*", "ulpf_contracts*", "ulpf_domain*", "ulpf_ingestion*", "ulpf_normalization*", "ulpf_parser_runtime*", "ulpf_platform*", "ulpf_semantic*", "ulpf_mapping*", "ulpf_onboarding*", "ulpf_ai*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S104", "E501"]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]
"tests/*.py" = ["S101", "E501"]
"tests/**" = ["S101", "E501"]
"scripts/*" = ["E501", "S101", "T201"]
"scripts/*.py" = ["E501", "S101", "T201"]
"scripts/**" = ["E501", "S101", "T201"]



[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = [
  "^tests/",
  "^build/",
]

mypy_path = ["apps/api", "apps/worker", "packages/contracts", "packages/domain", "packages/ingestion", "packages/normalization", "packages/parser-runtime", "packages/platform", "packages/semantic", "packages/mapping", "packages/onboarding", "packages/ai"]


[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["apps", "packages"]

[tool.coverage.report]
fail_under = 0

[tool.pytest.ini_options]
pythonpath = [
  "apps/api",
  "apps/worker",
  "packages/contracts",
  "packages/domain",
  "packages/ingestion",
  "packages/normalization",
  "packages/parser-runtime",
  "packages/platform",
  "packages/semantic",
  "packages/mapping",
  "packages/onboarding",
  "packages/ai",
]
